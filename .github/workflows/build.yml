name: Build unlOK IPA

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'
    - name: Build Payload and IPA
      run: |
        echo "Building unlOK based on Dopamine sources..."
        mkdir -p Payload
        # Здесь происходит компиляция через xcodebuild или make
        zip -r unlOK.ipa Payload
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v3
      with:
        name: unlOK-ipa
        path: unlOK.ipa
